name: Build AudioViz releases

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'AudioViz/**'
      - 'scripts/**'
      - 'fftw-3.3.11/**'
      - 'libogg/**'
      - 'libsndfile/**'
      - 'third_party/src/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to create/update a Release for this manual run'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: audioviz-release-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTENSION_DIR: AudioViz
  THIRDPARTY_DIST: ${{ github.workspace }}/third_party/dist

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build third-party static libraries
        shell: pwsh
        run: |
          ./scripts/build_thirdparty.ps1 -WorkspaceRoot "$PWD"

      - name: Build AudioViz
        shell: pwsh
        run: |
          Push-Location $env:EXTENSION_DIR
          cmake --preset x64-release
          cmake --build out/build/x64-release --parallel
          Pop-Location

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path "$env:EXTENSION_DIR/out/build/x64-release" -Recurse -File -Filter 'AudioViz.dll' | Select-Object -First 1
          if (-not $dll) { throw 'AudioViz.dll was not produced.' }
          New-Item -ItemType Directory -Force -Path release-assets, package | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination 'release-assets/AudioViz-windows-x64.dll'
          Copy-Item -LiteralPath $dll.FullName -Destination 'package/AudioViz.dll'
          Compress-Archive -Path 'package/AudioViz.dll' -DestinationPath 'release-assets/AudioViz-windows-x64.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets
          if-no-files-found: error

  build-linux:
    name: Ubuntu Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip

      - name: Build third-party static libraries
        shell: bash
        run: |
          mkdir -p "$THIRDPARTY_DIST"
          bash scripts/build_thirdparty.sh \
            --build "$RUNNER_TEMP/audioviz-thirdparty" \
            --dist "$THIRDPARTY_DIST"

      - name: Verify third-party static libraries
        shell: bash
        run: |
          set -euo pipefail
          test -f "$THIRDPARTY_DIST/include/fftw3.h"
          test -f "$THIRDPARTY_DIST/lib/libfftw3.a"

      - name: Build AudioViz
        working-directory: AudioViz
        run: |
          cmake --preset linux-release -DAUDIOVIZ_THIRDPARTY="$THIRDPARTY_DIST"
          cmake --build out/build/linux-release --parallel

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          so="$(find AudioViz/out/build/linux-release -type f \( -name 'libAudioViz.so' -o -name 'AudioViz.so' \) -print -quit)"
          test -n "$so"
          mkdir -p release-assets package
          cp "$so" release-assets/AudioViz-linux-x64.so
          cp "$so" package/AudioViz.so
          (cd package && zip -q "../release-assets/AudioViz-linux-x64.zip" AudioViz.so)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release-assets
          if-no-files-found: error

  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
          - armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;25.2.9519653'

      - name: Select NDK for CMake presets
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ndk_home="$sdk_root/ndk/25.2.9519653"
          test -f "$ndk_home/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip

      - name: Build third-party static libraries
        shell: bash
        run: |
          mkdir -p "$THIRDPARTY_DIST"
          bash scripts/build_thirdparty.sh \
            --build "$RUNNER_TEMP/audioviz-thirdparty-${{ matrix.abi }}" \
            --dist "$THIRDPARTY_DIST" \
            --toolchain "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            --android-abi '${{ matrix.abi }}'

      - name: Verify third-party static libraries
        shell: bash
        run: |
          set -euo pipefail
          test -f "$THIRDPARTY_DIST/include/fftw3.h"
          test -f "$THIRDPARTY_DIST/lib/libfftw3.a"

      - name: Build AudioViz
        working-directory: AudioViz
        run: |
          cmake --preset '${{ matrix.abi }}' -DAUDIOVIZ_THIRDPARTY="$THIRDPARTY_DIST"
          cmake --build 'out/build/android/${{ matrix.abi }}' --parallel

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          so="$(find "AudioViz/out/build/android/${{ matrix.abi }}" -type f -name 'libAudioViz.so' -print -quit)"
          test -n "$so"
          mkdir -p release-assets package/lib/'${{ matrix.abi }}'
          cp "$so" "release-assets/AudioViz-android-${{ matrix.abi }}.so"
          cp "$so" package/lib/'${{ matrix.abi }}'/libAudioViz.so
          (cd package && zip -qr "../release-assets/AudioViz-android-${{ matrix.abi }}.zip" lib)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android-${{ matrix.abi }}
          path: release-assets
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs:
      - build-windows
      - build-linux
      - build-android
    runs-on: ubuntu-22.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Package Android lib.jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-jar/lib
          for abi in arm64-v8a x86_64 armeabi-v7a; do
            source="release-assets/AudioViz-android-${abi}.so"
            test -f "$source"
            mkdir -p "android-jar/lib/${abi}"
            cp "$source" "android-jar/lib/${abi}/libAudioViz.so"
          done
          (cd android-jar && zip -qr ../release-assets/AudioViz-android.jar lib)

      - name: Publish Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
